<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>クラシックカー おさんぽドライブ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #8fd3ff;
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  #c { position: fixed; inset: 0; display: block; }

  /* ---- HUD (score + mute) ---- */
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 14px 18px;
    display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  #score { font-size: 40px; font-weight: 800; color: #fff;
    text-shadow: 0 3px 0 #f0a500, 0 5px 6px rgba(0,0,0,.25); }
  #btn-mute { pointer-events: auto; font-size: 26px; width: 52px; height: 52px; border: none;
    border-radius: 50%; background: rgba(255,255,255,.75); box-shadow: 0 4px 0 rgba(0,0,0,.15); }

  /* ---- bottom controls ---- */
  #controls { position: fixed; bottom: 0; left: 0; right: 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
  .pad { pointer-events: auto; display: flex; gap: 14px; align-items: flex-end; }
  .bigbtn { width: 96px; height: 96px; border: none; border-radius: 50%; font-size: 46px;
    color: #fff; box-shadow: 0 6px 0 rgba(0,0,0,.22); display: flex; align-items: center;
    justify-content: center; touch-action: none; }
  .bigbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.22); }
  #btn-left, #btn-right { background: #ff5d73; }
  #btn-turbo { background: #ff8a00; width: 104px; height: 104px; font-size: 50px; }
  #btn-turbo:active { background: #ff6a00; }
  #btn-horn { background: #ffc233; width: 66px; height: 66px; font-size: 30px; }

  .hidden { display: none !important; }

  /* ---- title / car select ---- */
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 22px; padding: 24px; overflow-y: auto;
    background: radial-gradient(circle at 50% 20%, #bfe8ff, #7fc4f0); }
  @media (max-height: 640px) { #title { justify-content: flex-start; } }
  #title h1 { font-size: clamp(26px, 6vw, 48px); color: #fff; font-weight: 900; text-align: center;
    text-shadow: 0 4px 0 #2b8fd6, 0 7px 8px rgba(0,0,0,.2); }
  #title .sub { font-size: clamp(15px, 3.4vw, 22px); color: #14507d; font-weight: 700; margin-top: -8px; }
  #cards { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 900px; }
  .card { width: 210px; max-width: 42vw; background: #fff; border-radius: 22px; padding: 10px 10px 14px;
    box-shadow: 0 8px 0 rgba(0,0,0,.12); border: 6px solid transparent; cursor: pointer; }
  .card.sel { border-color: #ff5d73; transform: translateY(-4px); }
  .card .prev { width: 100%; height: auto; border-radius: 14px; background: #eaf7ff; display: block; }
  .card .name { text-align: center; font-size: 24px; font-weight: 800; color: #14507d; margin-top: 6px; }
  #btn-start { border: none; background: #ff5d73; color: #fff; font-size: 34px; font-weight: 900;
    padding: 18px 54px; border-radius: 40px; box-shadow: 0 7px 0 #c93b50; cursor: pointer; }
  #btn-start:active { transform: translateY(4px); box-shadow: 0 3px 0 #c93b50; }
</style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud" class="hidden">
    <div id="score">⭐ 0</div>
    <button id="btn-mute">🔊</button>
  </div>

  <div id="controls" class="hidden">
    <div class="pad"><button id="btn-left" class="bigbtn">◀</button></div>
    <div class="pad">
      <button id="btn-horn" class="bigbtn">🎺</button>
      <button id="btn-turbo" class="bigbtn">🚀</button>
    </div>
    <div class="pad"><button id="btn-right" class="bigbtn">▶</button></div>
  </div>

  <div id="title">
    <h1>クラシックカー おさんぽドライブ</h1>
    <div class="sub">すきな くるまを えらんでね！</div>
    <div id="cards"></div>
    <button id="btn-start">スタート！</button>
  </div>

  <script src="js/engine.js"></script>
  <script src="js/cars.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
